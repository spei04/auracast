[project]
name = "auracast"
version = "0.0.1"
description = "Automated, AI-driven Instagram curation system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pillow>=10.0",
    "httpx>=0.27",
    "aiofiles>=23.2",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "streamlit>=1.34",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auracast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
